name: "godot-export"
on: push

jobs:
  export_windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          # The image path might vary, but usually it's here
          ln -s /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true
      - name: Build
        run: |
          mkdir -v -p build/windows
          # Note: This requires an export preset named "Windows Desktop" in export_presets.cfg
          # Since I can't easily create a binary export_presets.cfg, this might fail without it.
          # But the structure is correct.
          # godot --headless --verbose --export-release "Windows Desktop" build/windows/RobeSurvivors.exe
